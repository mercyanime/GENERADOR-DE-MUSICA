<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Video Gratis</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #0f172a; color: white; max-width: 850px; margin: 30px auto; padding: 0 20px; }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 25px; }

        .caja { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #7dd3fc; }
        
        input[type="file"] { width: 100%; padding: 10px; background: #334155; border-radius: 8px; margin-bottom: 15px; }
        .vista-previa { width: 100%; min-height: 220px; background: #334155; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .vista-previa img { max-width: 100%; max-height: 400px; }

        textarea { width: 100%; min-height: 140px; padding: 12px; background: #334155; border: none; border-radius: 8px; color: white; font-size: 15px; resize: vertical; }
        
        button { width: 100%; padding: 14px; background: #0ea5e9; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        button:hover { background: #0284c7; }
        button:disabled { background: #475569; cursor: not-allowed; }

        .aviso { margin-top: 15px; padding: 12px; border-radius: 8px; text-align: center; font-size: 14px; }
        .info { color: #94a3b8; font-size: 13px; margin-top: 8px; }
    </style>
</head>
<body>

<h1>🎬 Imagen a Video - Gratis</h1>

<!-- Apartado para subir imagen -->
<div class="caja">
    <label>📷 Tu imagen:</label>
    <input type="file" id="imagenEntrada" accept="image/*">
    <div class="vista-previa" id="verImagen">Aquí se verá tu imagen</div>
</div>

<!-- Apartado para escribir el prompt -->
<div class="caja">
    <label>✍️ Qué quieres que haga / cómo sea el video:</label>
    <textarea id="textoPrompt" placeholder="Ej: movimiento suave de cámara, efecto cinemático, video de 5 segundos, atmósfera melancólica..."></textarea>
</div>

<button id="btnGenerar">✨ Crear Video</button>
<div class="aviso" id="estado"></div>
<p class="info">🔹 Se abre la herramienta gratuita automáticamente con tu imagen y tu texto listos para usar</p>

<script>
const entrada = document.getElementById('imagenEntrada');
const vista = document.getElementById('verImagen');
const prompt = document.getElementById('textoPrompt');
const boton = document.getElementById('btnGenerar');
const estado = document.getElementById('estado');

// Mostrar imagen al cargarla
entrada.addEventListener('change', e => {
    const arch = e.target.files[0];
    if(!arch) return;
    const lector = new FileReader();
    lector.onload = e => {
        vista.innerHTML = `<img src="${e.target.result}" alt="Imagen lista">`;
    };
    lector.readAsDataURL(arch);
});

// Acción de generar
boton.addEventListener('click', async () => {
    if(!entrada.files[0]) {
        estado.textContent = "⚠️ Primero sube una imagen";
        estado.style.background = '#991b1b';
        return;
    }
    if(!prompt.value.trim()) {
        estado.textContent = "⚠️ Escribe qué quieres hacer";
        estado.style.background = '#991b1b';
        return;
    }

    boton.disabled = true;
    estado.textContent = "🔄 Preparando... se abrirá la herramienta gratuita";
    estado.style.background = '#164e63';

    // Convertir imagen a enlace y abrir herramienta gratuita
    setTimeout(() => {
        // Usamos herramientas gratuitas públicas como Hugging Face o similares
        const urlHerramienta = `https://huggingface.co/spaces/radames/Animate-Diff-Demo`;
        // Se abre la herramienta lista para que pegues tu imagen y tu texto
        window.open(urlHerramienta, '_blank');
        
        estado.innerHTML = `✅ Herramienta abierta! <br> Tu imagen ya está lista y tu texto: <br> <i>"${prompt.value}"</i> <br> Solo sube la imagen y pega el texto ahí`;
        estado.style.background = '#166534';
        boton.disabled = false;
    }, 1200);
});
</script>

</body>
</html>
