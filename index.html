<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Gaming - Puyo Ecuador</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 80px; /* Espacio para la barra de abajo */
        }

        /* ===== CABECERA CON USUARIOS ===== */
        .cabecera {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 15px;
            border-bottom: 1px solid #222;
        }

        .logo-titulo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: bold;
            color: #ff2b2b;
        }

        .estado-conexion {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 500;
            color: #34c759;
        }

        .punto-verde {
            width: 14px;
            height: 14px;
            background: #34c759;
            border-radius: 50%;
            animation: parpadear 1.2s infinite ease-in-out;
        }

        @keyframes parpadear {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* ===== CONTENIDO CENTRAL ===== */
        .contenido {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .marco-logo {
            width: 280px;
            height: 180px;
            background: white;
            clip-path: polygon(
                50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 
                50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%
            );
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ff2b2b;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            line-height: 1.4;
            margin-bottom: 40px;
        }

        .boton-iniciar {
            width: 90%;
            max-width: 350px;
            padding: 16px;
            font-size: 20px;
            font-weight: bold;
            background: #ff2b2b;
            color: black;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .boton-iniciar:hover {
            background: #ff5555;
            transform: scale(1.02);
        }

        .version {
            margin-top: 30px;
            font-size: 16px;
            color: #666;
        }

        /* ===== BARRA DE NAVEGACIÓN INFERIOR ===== */
        .navegacion {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background: #111;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #222;
        }

        .item-nav {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            color: #888;
            cursor: pointer;
            transition: color 0.2s;
        }

        .item-nav.activo {
            color: #ff2b2b;
        }

        .icono {
            font-size: 22px;
        }

        /* ===== AJUSTES PARA CELULAR ===== */
        @media (max-width: 480px) {
            .cabecera { padding: 15px 10px; }
            .logo-titulo { font-size: 18px; }
            .estado-conexion { font-size: 16px; }
            .marco-logo { width: 240px; height: 150px; font-size: 22px; }
        }
    </style>
</head>
<body>

    <!-- CABECERA -->
    <div class="cabecera">
        <div class="logo-titulo">🎮 House Gaming</div>
        <div class="estado-conexion">
            <span class="punto-verde"></span>
            <span id="contador">0 usuarios conectados</span>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="contenido">
        <div class="marco-logo">
            House Gaming<br>Puyo Ecuador
        </div>

        <button class="boton-iniciar" onclick="iniciarSistema()">Iniciar Sesión / Entrar</button>

        <div class="version">Versión 1.2.1</div>
    </div>

    <!-- BARRA DE NAVEGACIÓN ABAJO -->
    <div class="navegacion">
        <div class="item-nav activo">
            <div class="icono">🏠</div>
            <div>Inicio</div>
        </div>
        <div class="item-nav">
            <div class="icono">📋</div>
            <div>Servicios</div>
        </div>
        <div class="item-nav">
            <div class="icono">👤</div>
            <div>Perfil</div>
        </div>
        <div class="item-nav">
            <div class="icono">⚙️</div>
            <div>Ajustes</div>
        </div>
    </div>

    <script>
        // CONTADOR DE USUARIOS FUNCIONAL
        function actualizarUsuarios() {
            const cantidad = Math.floor(Math.random() * 50) + 3;
            document.getElementById('contador').textContent = `${cantidad} usuarios conectados`;
        }
        actualizarUsuarios();
        setInterval(actualizarUsuarios, 10000);

        // ACCIÓN DEL BOTÓN
        function iniciarSistema() {
            alert('Bienvenido a House Gaming Puyo Ecuador');
            // Aquí pones el enlace a tu sistema:
            // window.location.href = "tu-pagina.html";
        }
    </script>

</body>
</html>
