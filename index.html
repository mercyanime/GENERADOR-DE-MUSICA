<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Gaming - Puyo Ecuador</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: #000000;
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* 🟢 Indicador de usuarios real */
        .estado-conexion {
            position: absolute;
            top: 25px;
            left: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 28px;
            color: #ff3333;
            font-weight: 600;
        }

        .punto-verde {
            width: 22px;
            height: 22px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 12px #22c55e;
            animation: parpadeo 1.5s infinite ease-in-out;
        }

        @keyframes parpadeo {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* 💬 Bocadillo estilo cómic bien definido */
        .logo-central {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 260px;
            background: white;
            clip-path: polygon(
                50% 5%, 62% 38%, 98% 28%, 82% 52%, 100% 70%,
                68% 82%, 85% 100%, 50% 88%, 15% 100%, 32% 82%,
                0% 70%, 18% 52%, 2% 28%, 38% 38%
            );
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ff3333;
            font-size: 34px;
            font-weight: bold;
            text-align: center;
            line-height: 1.4;
            border: 2px solid #111;
        }

        /* ✨ Detalles decorativos */
        .puntos-decorativos span {
            position: absolute;
            background: white;
            border-radius: 50%;
        }
        .p1 { top: 47%; right: 27%; width: 10px; height: 10px; }
        .p2 { top: 45%; right: 25%; width: 7px; height: 7px; }
        .p3 { bottom: 30%; left: 48%; width: 12px; height: 12px; }
        .p4 { bottom: 28%; left: 51%; width: 8px; height: 8px; }

        /* 🎮 Botón Iniciar funcional */
        .boton-iniciar {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 45px;
            font-size: 22px;
            font-weight: bold;
            background: #1a1a1a;
            color: #ff3333;
            border: 2px solid #ff3333;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .boton-iniciar:hover {
            background: #ff3333;
            color: black;
        }

        /* 🔢 Versión */
        .version {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            color: #ff3333;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Aquí se verá el número real de usuarios -->
    <div class="estado-conexion">
        <span class="punto-verde"></span>
        Online <span id="contador-usuarios">0</span> usuarios
    </div>

    <div class="logo-central">
        House Gaming<br>Puyo Ecuador
    </div>

    <div class="puntos-decorativos">
        <span class="p1"></span>
        <span class="p2"></span>
        <span class="p3"></span>
        <span class="p4"></span>
    </div>

    <button class="boton-iniciar" onclick="alert('¡Entrando al sistema!')">Iniciar</button>

    <div class="version">Versión 1.2.1</div>

    <script>
        // 📊 Esto simula el contador de usuarios conectados
        // Cuando tengas tu servidor, aquí conectas la base de datos
        function actualizarUsuarios() {
            // Ejemplo: número aleatorio para probar
            const usuarios = Math.floor(Math.random() * 50) + 5;
            document.getElementById('contador-usuarios').textContent = usuarios;
        }

        // Se actualiza cada 10 segundos automáticamente
        actualizarUsuarios();
        setInterval(actualizarUsuarios, 10000);
    </script>

</body>
</html>
