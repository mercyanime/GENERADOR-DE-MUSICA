<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Gaming</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #000000;
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Indicador Online arriba a la izquierda */
        .estado-online {
            position: absolute;
            top: 40px;
            left: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 65px;
            color: #ff3333;
            font-weight: bold;
        }

        .punto-verde {
            width: 60px;
            height: 60px;
            background-color: #48b848;
            border-radius: 50%;
            box-shadow: 0 0 8px #48b848;
        }

        /* Bocadillo central estilo cómic */
        .marco-centro {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 240px;
            background-color: #ffffff;
            clip-path: polygon(
                50% 10%, 65% 35%, 95% 25%, 80% 55%, 100% 70%,
                70% 80%, 85% 100%, 50% 85%, 15% 100%, 30% 80%,
                0% 70%, 20% 55%, 5% 25%, 35% 35%
            );
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ff3333;
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            line-height: 1.3;
            border: 3px solid #000;
        }

        /* Detalles de burbujas decorativas */
        .burbuja-1 {
            position: absolute;
            top: 48%;
            right: 28%;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
        }
        .burbuja-2 {
            position: absolute;
            top: 46%;
            right: 26%;
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
        }
        .burbuja-3 {
            position: absolute;
            top: 62%;
            left: 48%;
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
        }
        .burbuja-4 {
            position: absolute;
            top: 65%;
            left: 51%;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
        }

        /* Versión abajo al centro */
        .version {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 55px;
            color: #ff3333;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="estado-online">
        <span class="punto-verde"></span>
        Online [Cantidad de users]
    </div>

    <div class="marco-centro">
        House Gaming<br>Puyo Ecuador
    </div>

    <!-- Burbujas decorativas -->
    <div class="burbuja-1"></div>
    <div class="burbuja-2"></div>
    <div class="burbuja-3"></div>
    <div class="burbuja-4"></div>

    <div class="version">Versión 1.2.1</div>

</body>
</html>
