<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            background-color: #000;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cuadro-centro {
            background-color: #1a1a1a;
            width: 200px;
            padding: 30px 15px;
            border-radius: 10px;
            text-align: center;
            color: #fff;
            border: 1px solid #333;
        }

        .arriba {
            font-size: 18px;
            margin-bottom: 40px;
        }

        .enlaces {
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="cuadro-centro">
        <div class="arriba">Online [Cantidad de users]</div>
        <div class="enlaces">
            <div>Inicio</div>
            <div>Versión. 1.2.1</div>
        </div>
    </div>

</body>
</html>
