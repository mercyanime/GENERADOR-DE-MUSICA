<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Gaming - Puyo Ecuador</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            min-height: 100vh;
            position: relative;
            padding-bottom: 70px;
        }

        /* 🟢 ARRIBA: USUARIOS CONECTADOS */
        .estado {
            position: absolute;
            top: 25px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Press Start 2P', sans-serif;
            font-size: 14px;
            color: #ff2b2b;
        }

        .punto {
            width: 16px;
            height: 16px;
            background: #34c759;
            border-radius: 50%;
            animation: parpadeo 1.2s infinite ease-in-out;
        }

        @keyframes parpadeo {
            0% { opacity: 1; }
            50% { opacity: 0.2; }
            100% { opacity: 1; }
        }

        /* 🎮 BOTÓN CENTRAL ESTILO GAMING */
        .boton-principal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 25px 50px;
            font-family: 'Press Start 2P', sans-serif;
            font-size: 28px;
            color: #ff2b2b;
            background: transparent;
            border: 3px solid #ff2b2b;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .boton-principal:hover {
            background: #ff2b2b;
            color: #000;
            box-shadow: 0 0 20px #ff2b2b;
        }

        /* 🔢 VERSIÓN */
        .version {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            font-family: Arial, sans-serif;
            font-size: 16px;
            color: #444;
        }

        /* 🧭 BARRA DE NAVEGACIÓN LIMPIA */
        .navegacion {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: #0a0a0a;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            border-top: 1px solid #222;
        }

        .item {
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: #777;
            cursor: pointer;
            transition: color 0.2s;
        }

        .item.activo {
            color: #ff2b2b;
            font-weight: bold;
        }

        /* AJUSTE CELULAR */
        @media (max-width: 480px) {
            .estado { font-size: 11px; }
            .boton-principal { font-size: 18px; padding: 20px 35px; }
        }
    </style>
</head>
<body>

    <div class="estado">
        <span class="punto"></span>
        Online: <span id="contador">0</span>
    </div>

    <button class="boton-principal" onclick="entrar()">
        House Gaming
    </button>

    <div class="version">Versión 1.2.1</div>

    <div class="navegacion">
        <div class="item activo">Inicio</div>
        <div class="item">Servidores</div>
        <div class="item">Tienda</div>
        <div class="item">Soporte</div>
    </div>

    <script>
        // CONTADOR - AQUÍ LUEGO PONES TUS NÚMEROS REALES
        function actualizar() {
            // Cambia esto por los datos de tu servidor cuando lo tengas
            const usuarios = Math.floor(Math.random() * 100) + 5;
            document.getElementById('contador').textContent = usuarios;
        }
        actualizar();
        setInterval(actualizar, 15000);

        function entrar() {
            alert('Entrando a House Gaming...');
            // window.location.href = "tu-pagina.html";
        }
    </script>

</body>
</html>
